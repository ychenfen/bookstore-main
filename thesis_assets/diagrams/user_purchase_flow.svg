<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
<defs>
<style>text{font-family:Arial,sans-serif}</style>
<marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
</defs>
<rect width="1100" height="700" fill="#f8fafc"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#102a43">用户购书业务流程图</text>

<!-- 泳道1 浏览 -->
<rect x="20" y="55" width="1060" height="165" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="36" y="76" font-size="13" font-weight="600" fill="#1e40af">阶段一：图书浏览</text>
<rect x="40" y="90" width="140" height="60" rx="30" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="110" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">进入系统</text>
<text x="110" y="136" text-anchor="middle" font-size="11" fill="#52606d">首页/图书列表</text>
<rect x="240" y="90" width="150" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="315" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">搜索与筛选</text>
<text x="315" y="136" text-anchor="middle" font-size="11" fill="#52606d">关键词/分类/排序</text>
<rect x="450" y="90" width="150" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="525" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">查看图书详情</text>
<text x="525" y="136" text-anchor="middle" font-size="11" fill="#52606d">价格/库存/简介</text>
<polygon points="700,90 780,120 700,150 620,120" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="700" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">库存充足?</text>
<rect x="850" y="90" width="150" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="925" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">加入购物车</text>
<text x="925" y="136" text-anchor="middle" font-size="11" fill="#52606d">选择数量加购</text>
<line x1="180" y1="120" x2="240" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="390" y1="120" x2="450" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="120" x2="620" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="120" x2="850" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="790" y="114" font-size="11" fill="#16a34a">是</text>
<line x1="700" y1="150" x2="700" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="706" y="178" font-size="11" fill="#ef4444">否→提示缺货</text>

<!-- 泳道2 下单 -->
<rect x="20" y="240" width="1060" height="165" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="36" y="261" font-size="13" font-weight="600" fill="#15803d">阶段二：下单结算</text>
<line x1="925" y1="150" x2="925" y2="275" stroke="#64748b" stroke-width="2"/>
<line x1="925" y1="275" x2="840" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="660" y="255" width="160" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="740" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">购物车管理</text>
<text x="740" y="301" text-anchor="middle" font-size="11" fill="#52606d">修改数量/删除</text>
<rect x="460" y="255" width="160" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="540" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">填写收货信息</text>
<text x="540" y="301" text-anchor="middle" font-size="11" fill="#52606d">姓名/电话/地址</text>
<polygon points="310,255 390,285 310,315 230,285" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="310" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">提交校验</text>
<text x="310" y="298" text-anchor="middle" font-size="11" fill="#52606d">库存/金额</text>
<rect x="60" y="255" width="140" height="60" rx="6" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
<text x="130" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">创建订单</text>
<text x="130" y="301" text-anchor="middle" font-size="11" fill="#52606d">库存核减+写入</text>
<line x1="660" y1="285" x2="620" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="460" y1="285" x2="390" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="230" y1="285" x2="200" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<text x="196" y="279" font-size="11" fill="#16a34a">通过</text>
<line x1="310" y1="315" x2="310" y2="360" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="316" y="348" font-size="11" fill="#ef4444">失败→回滚</text>

<!-- 泳道3 跟踪 -->
<rect x="20" y="420" width="1060" height="165" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="36" y="441" font-size="13" font-weight="600" fill="#7e22ce">阶段三：订单跟踪</text>
<line x1="130" y1="315" x2="130" y2="455" stroke="#64748b" stroke-width="2"/>
<line x1="130" y1="455" x2="210" y2="455" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="210" y="435" width="160" height="60" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
<text x="290" y="463" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">查看订单列表</text>
<text x="290" y="481" text-anchor="middle" font-size="11" fill="#52606d">状态/金额/时间</text>
<rect x="430" y="435" width="160" height="60" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
<text x="510" y="463" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">查看订单详情</text>
<text x="510" y="481" text-anchor="middle" font-size="11" fill="#52606d">商品明细/收货信息</text>
<rect x="650" y="435" width="160" height="60" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
<text x="730" y="463" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">等待发货</text>
<text x="730" y="481" text-anchor="middle" font-size="11" fill="#52606d">管理员更新状态</text>
<rect x="870" y="435" width="160" height="60" rx="30" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
<text x="950" y="463" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">完成购书</text>
<text x="950" y="481" text-anchor="middle" font-size="11" fill="#52606d">流程结束</text>
<line x1="370" y1="465" x2="430" y2="465" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="590" y1="465" x2="650" y2="465" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<line x1="810" y1="465" x2="870" y2="465" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
</svg>